name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Shared files in sync
        run: python3 scripts/sync_shared.py --check
      - name: Validator tests
        run: python3 -m unittest discover tests -v
